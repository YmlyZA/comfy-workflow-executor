<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <title>Comfy Workflow Executor</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('cwe-theme')
          var dark =
            t === 'dark' ||
            (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          // 首帧就把浏览器 UI 色刷成存储偏好对应的值(上面两条媒体查询版只认系统偏好);
          // 色值与 src/lib/theme.ts 的 THEME_COLORS 同源(那里注明了第三处副本),改动需同步。
          var c = dark ? '#020617' : '#f8fafc'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = c
          })
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
