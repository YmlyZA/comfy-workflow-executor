<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- maskable 变体:满幅背景(圆角由系统遮罩决定),图形收在中心 50% 内以留足安全区。
       这是 icon-maskable-512.png 的设计源文件,运行时无引用(manifest 用的是 PNG);
       留在 public/ 是为了与 icon.svg 成对便于查找。 -->
  <rect width="512" height="512" fill="#4f46e5"/>
  <rect x="128" y="128" width="160" height="160" rx="19" fill="#ffffff" opacity="0.92"/>
  <rect x="224" y="224" width="160" height="160" rx="19" fill="#ffffff" opacity="0.55"/>
</svg>
