services:
  executor:
    build: .
    ports:
      - '${HOST_PORT:-8080}:8080'
    environment:
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN in .env}
    volumes:
      - data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  data:
